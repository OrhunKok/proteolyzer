[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "proteolyzer"
description = "Processing, analysis and visualization of proteomics data."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Orhun Kok", email = "kok.o@northeastern.edu" }]
keywords = ["proteomics", "mass-spectrometry", "single-cell", "DIA-NN", "MaxQuant"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas",
    "numpy",
    "pydantic",
    "pyarrow",
    "matplotlib",
    "seaborn",
    "scienceplots",
    "adjusttext",
    "chardet",
    # `.xlsx` is a routed extension in core.loader, so pandas reaches for openpyxl
    # to read one. A dependency rather than an extra because the routing is the
    # promise: a caller handed a spreadsheet and an ImportError from pandas has
    # been told the format is supported and then that it is not. It is ~250 KB of
    # pure Python, and pandas imports it inside read_excel, so importing
    # proteolyzer does not pay for it -- test_package_boundaries keeps that true.
    "openpyxl",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/OrhunKok/proteolyzer"
Repository = "https://github.com/OrhunKok/proteolyzer"
Issues = "https://github.com/OrhunKok/proteolyzer/issues"

[project.optional-dependencies]
# Only needed to *build* the UniMod cache; querying an existing one uses the
# standard library. See proteolyzer.unimod.
unimod = [
    "requests",
    "sqlalchemy",
    "xml2db",
]
dev = [
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
# Bounded on purpose. MkDocs 1.6.1 is from August 2024 and its maintainer is
# reportedly moving to an incompatible 2.0, so a major release must not be able
# to reach a build: mkdocs-material already requires mkdocs<2, and these bounds
# hold even without it.
#
# Staying on the 1.x line rather than pre-emptively switching to properdocs, the
# community continuation: mkdocs-material and mkdocstrings are the actively
# released parts of this stack and both still depend on mkdocs itself. If they
# move, the switch is `pip install properdocs` and `properdocs build` with no
# change to mkdocs.yml or to any page -- properdocs reads the mkdocs.plugins and
# mkdocs.themes entry points as well as its own, so the plugins below are found
# either way.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=1.0,<2",
    # The handler owning the options block in mkdocs.yml.
    "mkdocstrings-python>=2,<3",
    "mkdocs-gen-files>=0.5,<1",
    "mkdocs-literate-nav>=0.6,<1",
    "mkdocs-section-index>=0.3,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The UniMod CSVs only; the database they are built from is not shipped at all,
# being 5 MB against their 221 KB. `proteolyzer.unimod` builds it on first use.
"*" = ["resources/*.csv", "py.typed"]

[tool.setuptools_scm]
# For a build with no repository to read: a GitHub source archive, or a vendored
# copy. Without it `pip install <archive>.tar.gz` fails outright, which is why a
# consumer's image ends up installing git for this one requirement.
fallback_version = "0.0.0"

[tool.mypy]
# Checked so far: the base suite, and cellenone since a downstream consumer
# reads every run through it. The plots subpackage is not annotated enough to
# pass yet; add it here as it is typed. `aas` left the repository.
files = [
    "src/proteolyzer/reference.py",
    "src/proteolyzer/core",
    "src/proteolyzer/cellenone",
]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# mypy cannot see through @computed_field stacked on @cached_property, which is
# how pydantic exposes derived fields.
disable_error_code = ["prop-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:proteolyzer.*"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
# Pyflakes (F), a subset of pycodestyle (E4/E7/E9 + W), isort (I),
# pyupgrade (UP), flake8-bugbear (B) and flake8-comprehensions (C4).
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4"]
# `== True` is meaningful on object/nullable-boolean pandas columns.
ignore = ["E712"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["E712"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
