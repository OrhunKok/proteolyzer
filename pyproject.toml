[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "proteolyzer"
description = "Processing, analysis and visualization of proteomics data."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Orhun Kok", email = "kok.o@northeastern.edu" }]
keywords = ["proteomics", "mass-spectrometry", "single-cell", "DIA-NN", "MaxQuant"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas",
    "numpy",
    "pydantic",
    "pyarrow",
    "matplotlib",
    "seaborn",
    "scienceplots",
    "adjusttext",
    "chardet",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/OrhunKok/proteolyzer"
Repository = "https://github.com/OrhunKok/proteolyzer"
Issues = "https://github.com/OrhunKok/proteolyzer/issues"

[project.optional-dependencies]
aas = [
    "pyahocorasick",
    "biopython",
    "pyyaml",
    "fastparquet",
    "openpyxl",
    # quickdna has no wheels for this interpreter on PyPI, so pinned builds are
    # published alongside the fork. Only needed by proteolyzer.aas.translation.
    # Windows
    "quickdna @ https://github.com/OrhunKok/quickdna/releases/download/v0.6.0/quickdna-0.6.0-cp314-cp314-win_amd64.whl ; sys_platform == 'win32'",
    # Linux
    "quickdna @ https://github.com/OrhunKok/quickdna/releases/download/v0.6.0/quickdna-0.6.0-cp314-cp314-manylinux_2_28_x86_64.whl ; sys_platform == 'linux'",
    # Apple Silicon macOS
    "quickdna @ https://github.com/OrhunKok/quickdna/releases/download/v0.6.0/quickdna-0.6.0-cp314-cp314-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'"
]
dev = [
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "pydoc-markdown",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The UniMod CSVs only; the database they are built from lives in tools/unimod.
"*" = ["resources/*.csv", "py.typed"]

[tool.setuptools_scm]

[tool.mypy]
# Checked so far: the base suite. The aas, cellenone and plots subpackages are
# not annotated enough to pass yet; add them here as they are typed.
files = [
    "src/proteolyzer/reference.py",
    "src/proteolyzer/core",
]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# mypy cannot see through @computed_field stacked on @cached_property, which is
# how pydantic exposes derived fields.
disable_error_code = ["prop-decorator"]

[tool.pytest.ini_options]
# tools/ is not installed but is tested, so the repo root is importable.
testpaths = ["tests", "tools"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:proteolyzer.*"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
# Pyflakes (F), a subset of pycodestyle (E4/E7/E9 + W), isort (I),
# pyupgrade (UP), flake8-bugbear (B) and flake8-comprehensions (C4).
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4"]
# `== True` is meaningful on object/nullable-boolean pandas columns.
ignore = ["E712"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["E712"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
