# Mirrors the lint job in .github/workflows/ci.yml, so failures show up before
# a push rather than after. Install with: pre-commit install
#
# Notebook outputs are deliberately left alone: examples/ keeps them as
# documentation, so no nbstripout hook here.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.ipynb$
      - id: end-of-file-fixer
        exclude: \.ipynb$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Roomy enough for the bundled unimod.db (5 MB), tight enough to catch
      # search output being committed by accident.
      - id: check-added-large-files
        args: [--maxkb=6144]
      # `chmod +x` in this working tree does not reach the index -- the workspace
      # is a bind mount from macOS where the mode does not survive -- so a script
      # gets committed 100644 and a fresh clone cannot run it. That happened
      # twice, and both times the symptom was `permission denied` on a script
      # that was executable locally. `git update-index --chmod=+x <file>` is the
      # fix; this is what notices.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
