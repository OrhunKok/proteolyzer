name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      # Check only: a CI run that fixes findings and throws the fix away
      # reports success on code that is still unformatted locally.
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check --diff src tests scripts

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install proteolyzer
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      # Scope is set by [tool.mypy] files in pyproject.toml.
      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install proteolyzer
        # quickdna (in the aas extra) is only needed by the translation stage
        # and ships as a platform-specific wheel, so it is installed separately
        # and allowed to fail; the tests that need it skip themselves.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,unimod]'
          pip install pyahocorasick biopython pyyaml fastparquet openpyxl
      - name: Test
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'
      # mkdocstrings reads the source statically, so the plugins' optional
      # dependencies are not needed to document them. --strict turns a broken
      # link or an unresolvable reference into a failure.
      - name: Build the documentation
        run: mkdocs build --strict
