name: Cross-repo

# A message from another project in the network is work, not a notification. The
# convention in claude-shared is that whoever finds it does it; this makes "finds
# it" not depend on a person opening a session here.
#
# What stays in this file is what only this repository can say: when to wake, on
# which messages, with what authority, and how to install itself. The worker
# itself is called below, from claude-shared-workflows — three repositories were
# each running a 214-line copy of it, four defects were found in it in one day,
# and every fix had to be made three times. This was the last copy; the two
# consumers moved to the stub on 2026-08-22.
#
# Why that is a separate repository from claude-shared, which is where everything
# else shared lives: a public repository cannot resolve a reusable workflow out of
# a private one. The run fails with zero jobs, before anything starts, and no
# permission setting changes it — a public run's logs are world-readable, so the
# refusal is about what would be published rather than about who owns what. This
# repository is the public one, which is why the workflows are public at all.
#
# Credentials, if this ever stops working: the worker reads
# CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY from this repository's secrets,
# and with neither it comments on the issue and stops rather than failing.
on:
  # labeled only, not [opened, labeled]: an issue created *with* a label emits
  # both, so the first live run in the network answered one message twice.
  # Anything opened without a label and labelled later still arrives here, which
  # is every case that matters.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work on"
        required: true

jobs:
  handle:
    # Only the two labels the bus runs on, and not an issue an agent filed
    # itself: an agent that answers its own messages is a loop with a bill.
    #
    # The Bot exclusion is why the pin check calls the worker directly instead of
    # labelling something: an issue created by a token would be excluded here
    # even if Actions did raise an event for it, which it does not. Nothing here
    # runs a pin check — this repository is the root of the graph and pins none
    # of the others.
    if: >
      github.event_name == 'workflow_dispatch' ||
      ((github.event.label.name == 'from-upstream' ||
        github.event.label.name == 'cross-repo-question') &&
       !contains(github.event.issue.labels.*.name, 'agent-filed') &&
       github.event.issue.user.type != 'Bot')

    uses: OrhunKok/claude-shared-workflows/.github/workflows/cross-repo-worker.yml@v1
    with:
      # Empty on an issues event, where the worker reads the number off the
      # event itself.
      issue: ${{ inputs.issue }}
      # The gate is `make test`, `make lint` and `make types`, so the agent needs
      # the dev extra to run any of it.
      install: pip install -e '.[dev]'
      # No `context`: what a worker needs to know here — that two repositories
      # pin this one, that a public interface moving means a CHANGELOG entry and
      # a tag, and that a release means moving their pins — is in CLAUDE.md,
      # where a person reads it too. A second copy in this file is a copy that
      # goes stale.
    secrets: inherit

    # Granted here rather than taken there: the repository whose contents are at
    # stake is the one that decides what the worker may do.
    permissions:
      contents: write        # to push a branch
      pull-requests: write   # to open the pull request
      issues: write          # to answer and close the issue
      actions: read          # to read the CI result on the pull request it opens
      id-token: write        # the action asks for this in its own example
