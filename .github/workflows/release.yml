name: Release

# A tag is what a consumer pins, so a tag has to produce something a consumer
# can install. A GitHub source archive cannot: it carries no .git, so
# setuptools-scm falls back and the version reads 0.0.0 whichever tag it came
# from — pip then cannot tell one release from the next. A wheel carries the
# version in its metadata, so that is what is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Whole history and tags: setuptools-scm reads the version from them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build the sdist and the wheel
        run: |
          pip install build
          python -m build

      # The version in the artifact has to be the tag, or the tag is not what
      # was published. A dev version here means the tag was not fetched.
      - name: Check the version is the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*proteolyzer-([^-]+)-.*/\1/')
          echo "tag $tag, built $built"
          test "$tag" = "$built"

      # `gh release upload` needs a release to already exist and says only
      # 'release not found' when there is none. Every release up to v0.2.1 was
      # made in the web UI, which creates the tag as a side effect, so the tag
      # push always arrived after the release and the gap never showed. v0.2.2
      # was tagged from a terminal instead: the build went red and the tag stood
      # for a day with no wheel behind it, which is the one thing a tag here is
      # for. So make the release rather than assume it.
      - name: Make sure there is a release to attach to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME is already there"
            exit 0
          fi
          # The notes are the CHANGELOG section for this version, which is
          # written by hand and says what a consumer has to do about it.
          awk -v want="## $GITHUB_REF_NAME" \
              '$0 == want {inside = 1; next} /^## / {inside = 0} inside' \
              CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "::warning::no CHANGELOG section for $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
