# sshd for the remote frontend, so an app on the Mac can treat this container as
# a remote host and give it a real workspace instead of a dumb pane. Started by
# start-sshd.sh with an explicit -f, so the distribution's own sshd_config is
# left alone.
#
# Port 2222 rather than 22, and no root login: the only account here is node, and
# it is the one holding the workspace.

# `Protocol 2` is deliberately absent. servconf.h marks it SSHCONF_IGNORE, so a
# modern sshd parses and discards it, and a line that reads like a setting while
# doing nothing is worse than no line.
Port 2222
AddressFamily any

# Both families, explicitly, and the second line is the one with a history.
# `AddressFamily any` does not decide this: once any ListenAddress is given sshd
# binds only what is listed, so `0.0.0.0` alone left this listening on IPv4 only
# -- confirmed with `ss -tln`, one `0.0.0.0:2222` row and no `[::]`.
#
# That matters because Apple `container` gives each container a global IPv6
# address as well as a v4 one, registers both, and its resolver hands the **IPv6
# record back first**: `dscacheutil -q host -a name <name>.adevcontainers.local`
# prints ipv6_address above ip_address. `ssh(1)` tries addresses in turn and
# falls back, so the command line -- and this repository's own login check --
# never noticed. A client that connects to the first address and does not retry
# gets a refused connection with every field correct, which is the least
# debuggable failure there is.
ListenAddress 0.0.0.0
ListenAddress ::

HostKey /etc/ssh/ssh_host_rsa_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_ed25519_key

# `UsePAM no` is the line with a consequence, and it is not this file's to fix.
# node arrives from the base image shadow-locked, and OpenSSH's allowed_user()
# refuses a locked account for *public key* auth whenever UsePAM is off. Every
# visible thing is then correct -- authorized_keys byte-exact, .ssh 700, the file
# 600 -- and the client still sees a bare `Permission denied (publickey)`. The
# Dockerfile unlocks the account with `usermod -p '*'`, which means "no password
# accepted" rather than "no password required"; password auth stays off, and
# PasswordAuthentication no below says so a second time.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM no
AuthorizedKeysFile .ssh/authorized_keys
PermitEmptyPasswords no
AcceptEnv TERM_PROGRAM TERM_PROGRAM_VERSION COLORTERM

X11Forwarding no

# Load-bearing, not boilerplate. A frontend that leases terminals through a relay
# on this side reaches that relay over the ssh connection, and forwarding is what
# carries it -- a port or a unix socket handed back to the app. Clients ask with
# ExitOnForwardFailure=yes, so refusing it here does not degrade the connection,
# it fails it.
AllowTcpForwarding yes
AllowStreamLocalForwarding yes
StreamLocalBindUnlink yes

GatewayPorts no
PermitTunnel no
ClientAliveInterval 30
ClientAliveCountMax 2
PrintMotd no
PidFile /run/sshd-remote.pid

# Dragging an image into the editor uploads it over sftp. Debian's path, not
# Alpine's.
Subsystem sftp /usr/lib/openssh/sftp-server
