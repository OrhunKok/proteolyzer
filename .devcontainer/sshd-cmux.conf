# sshd for cmux, so `cmux ssh` can treat this container as a remote host and
# give it a real workspace instead of a dumb pane. Started by start-sshd.sh with
# an explicit -f, so the distribution's own sshd_config is left alone.
#
# This is cmux's own test fixture (tests/fixtures/ssh-remote/sshd_config), which
# is the configuration its Docker integration suites run against, minus root
# login and moved off port 22. Deviating from it invites surprises.

# The fixture also carries `Protocol 2`. Dropped: servconf.h marks it
# SSHCONF_IGNORE, so modern sshd parses and discards it, and a line that reads
# like a setting while doing nothing is worse than no line.
Port 2222
AddressFamily any
ListenAddress 0.0.0.0

HostKey /etc/ssh/ssh_host_rsa_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_ed25519_key

# The fixture permits root because its test logs in as root. Here the only user
# is node, and it is the one holding the workspace.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM no
AuthorizedKeysFile .ssh/authorized_keys
PermitEmptyPasswords no
AcceptEnv TERM_PROGRAM TERM_PROGRAM_VERSION COLORTERM

X11Forwarding no

# Load-bearing, not boilerplate. cmux reverse-forwards a TCP port back to the
# app -- `ssh -N -R 127.0.0.1:PORT:...` -- and that is what makes the `cmux` CLI
# work from inside this container. It runs with ExitOnForwardFailure=yes, so a
# refusal here does not degrade, it fails.
AllowTcpForwarding yes
AllowStreamLocalForwarding yes
StreamLocalBindUnlink yes

GatewayPorts no
PermitTunnel no
ClientAliveInterval 30
ClientAliveCountMax 2
PrintMotd no
PidFile /run/sshd-cmux.pid

# Dragging an image into the pane uploads it over sftp. Debian's path, not the
# fixture's Alpine one.
Subsystem sftp /usr/lib/openssh/sftp-server
